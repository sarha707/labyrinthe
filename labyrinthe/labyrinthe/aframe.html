<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
  <a-scene>

<a-assets>
                <img id="texture" src="./assets/images/bushes.jpg">
                <img id="texture2" src="./assets/images/sol.jpg">
                 <a-asset-item id="mtl-cake" src="./3dmodels/Cake.mtl"></a-asset-item>
                <a-asset-item id="obj-cake" src="./3dmodels/Cake.obj"></a-asset-item>
</a-assets>

    <a-plane
      position="0 0 -1.2"
      rotation="-90 0 0"
      width="4"
      height="4"
      material="src: #texture2; repeat: 5 5"
     color="#54524F">
    </a-plane>


<!-- murs éxterieurs-->
    <a-box
      material="src: #texture; repeat: 5 2"
      position="0 0.2 -3.2"
      width="4"
      height="0.5"
      depth="0.1"
      scale="1 1.1 3">
    </a-box>

    <a-box 
     material="src: #texture; repeat: 5 2"
     position="-2 0.2 -0.7"
     width="0.1" 
     height="0.5" 
     depth="4" 
     scale="3 1.1 0.8">
    </a-box>

    <a-box 
     material="src: #texture; repeat: 5 2"
      position="1.9 0.2 -1.2" 
      width="0.1" 
      height="0.5" 
      depth="4" 
      scale="3 1.1 1.0">
    </a-box>

    <a-box 
      material="src: #texture; repeat: 5 2"
      position="-0.4 0.2 0.7"
      width="4" 
      height="0.5" 
      depth="0.1" 
      scale="0.8 1.1 3">
    </a-box>

     <a-box 
      material="src: #texture; repeat: 5 2"
      position="1.7 0.3 0.7"
      width="4" 
      height="0.5" 
      depth="0.1" 
      scale="0.1 0.7 3">
    </a-box>
<!-- murs éxterieurs-->



    <a-box 
      material="src: #texture; repeat: 5 2"
      position="-1 0.2 -2.3" 
      width="1.5" 
      height="0.5"
     depth="0.1" 
     scale="1.4 1.1 3">
    </a-box>

   <a-box 
      material="src: #texture; repeat: 5 2"
      position="-1.3 0.2 -0.2" 
      width="0.1" 
      height="1.2" 
      depth="1" 
      geometry="depth: 1.7" 
      scale="3 0.4 1.2">
   </a-box>

    <a-box 
      material="src: #texture; repeat: 5 2"
      position="1.2 0.2 -2.3" 
      width="0.0" 
      height="0.4" 
      depth="1" 
      geometry="depth: 1.6" 
      scale="3 1.1 1.1">
    </a-box>

    <a-box 
      material="src: #texture; repeat: 5 2"
      position="0.6 0.2 -0.7"
      width="1.2" 
      height="0.5" 
      depth="0.1" 
      scale="2 1.1 3">
    </a-box>

   <a-box
      material="src: #texture; repeat: 5 2"
      position="0.4 0.2 -1.6" 
      height="0.4"
      width="1.7"
      depth="0.1" 
      geometry="depth: 0.06"
       scale="1 1.1 4.7">
    </a-box>

    <a-box 
      material="src: #texture; repeat: 5 2"
      position="-0.6 0.2 -0.4"
     width="0.1" 
     height="1.2" 
     depth="1" 
     scale="3 0.4 1">
   </a-box>

    <a-box 
      material="src: #texture; repeat: 5 2"
      position="0.5 0.2 0.2"
     width="0.1" 
     height="1.2" 
     depth="1" 
     scale="3 0.4 1">
    </a-box>

    <a-entity
      camera="active:true"
      look-controls wasd-controls="acceleration: 5"
      position="-1.7 0.2 -2.7"
      wasd-controls
      look-controls>
    </a-entity>

   <a-entity 
      id="cake" 
      position="1.5 -0.004 -0.4" 
      obj-model="mtl: #mtl-cake; obj: #obj-cake" 
      scale="0.003 0.003 0.003">
    </a-entity>

  <a-entity 
    id="cake" 
    position="1.5 -0.004 -0.4" 
    obj-model="mtl: #mtl-cake; obj: #obj-cake"
    scale="0.003 0.003 0.003">
  </a-entity>

  </a-scene>
</body>
</html>
